<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.75" opacity="0.4" />
      <circle cx="30" cy="0" r="1.5" fill="#374151" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #9CA3AF;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #60A5FA;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Glowing Orbs (Dynamic Ambience) -->
  <circle cx="150" cy="180" r="130" fill="#3B82F6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="6s" repeatCount="indefinite" />
    <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="120" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="300" r="120" fill="#EC4899" opacity="0.1" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.16;0.05" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Telematics Pulse Wave Lines -->
  <path d="M 0 310 Q 150 280, 300 310 T 600 310 T 900 310 T 1200 310" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.35">
    <animate attributeName="d" 
      values="M 0 310 Q 150 280, 300 310 T 600 310 T 900 310 T 1200 310;
              M 0 310 Q 150 340, 300 310 T 600 310 T 900 310 T 1200 310;
              M 0 310 Q 150 280, 300 310 T 600 310 T 900 310 T 1200 310" 
      dur="8s" repeatCount="indefinite" />
  </path>
  <path d="M 0 325 Q 200 350, 400 325 T 800 325 T 1200 325" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4">
    <animate attributeName="d" 
      values="M 0 325 Q 200 350, 400 325 T 800 325 T 1200 325;
              M 0 325 Q 200 300, 400 325 T 800 325 T 1200 325;
              M 0 325 Q 200 350, 400 325 T 800 325 T 1200 325" 
      dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Left Visual: Futuristic Vehicle Diagnostic / Telematics Hub -->
  <g transform="translate(75, 75)">
    <!-- Outer Diagnostic Ring -->
    <circle cx="95" cy="95" r="85" fill="#1E293B" stroke="#374151" stroke-width="2" opacity="0.8" />
    <circle cx="95" cy="95" r="85" fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" stroke-dasharray="140 380" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 95 95" to="360 95 95" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="95" cy="95" r="70" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="80 250" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 95 95" to="0 95 95" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Inner Core & Vehicle / Maintenance Icons -->
    <circle cx="95" cy="95" r="54" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" />
    
    <!-- Vehicle Silhouette -->
    <path d="M 72 102 C 72 98, 77 92, 85 90 L 105 90 C 113 92, 118 98, 118 102 L 122 107 C 123 108, 123 110, 120 110 L 70 110 C 67 110, 67 108, 68 107 Z" fill="url(#cyanGrad)" />
    <!-- Wheels -->
    <circle cx="79" cy="110" r="5" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />
    <circle cx="111" cy="110" r="5" fill="#1E293B" stroke="#60A5FA" stroke-width="2" />
    <!-- Wrench / Tool Accent -->
    <path d="M 88 78 L 92 82 M 102 78 L 98 82 M 95 74 L 95 83" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />

    <!-- Telematics Pulse Orbit Dots -->
    <circle cx="95" cy="10" r="4" fill="#10B981" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="95" r="4" fill="#3B82F6" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="95" cy="180" r="4" fill="#EC4899" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="10" cy="95" r="4" fill="#F59E0B" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center-Right Text & Information -->
  <g transform="translate(305, 75)">
    <!-- Tagline / Category -->
    <text x="0" y="24" class="tagline">⚡ Curated Fleet &amp; Mobility Hub ⚡</text>

    <!-- Main Title with Gradient Glow -->
    <text x="0" y="70" class="title" fill="#FFFFFF">
      Awesome Vehicle Maintenance
    </text>
    <text x="0" y="115" class="title" fill="url(#primaryGrad)">
      Platform Ecosystem
    </text>

    <!-- Subtitle -->
    <text x="0" y="148" class="subtitle">
      Curated directory of SaaS &amp; Open-Source tools for Fleet Management, PM, CMMS &amp; Telematics
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: Fleet Maintenance -->
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" />
      <circle cx="14" cy="16" r="4" fill="#3B82F6" />
      <text x="26" y="21" class="badge-text" fill="#E2E8F0">🚗 Fleet Operations</text>

      <!-- Pill 2: PM & CMMS -->
      <rect x="175" y="0" width="145" height="32" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2" />
      <circle cx="189" cy="16" r="4" fill="#8B5CF6" />
      <text x="201" y="21" class="badge-text" fill="#E2E8F0">🔧 CMMS &amp; PM</text>

      <!-- Pill 3: Inspections & Telematics -->
      <rect x="330" y="0" width="170" height="32" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.2" />
      <circle cx="344" cy="16" r="4" fill="#10B981" />
      <text x="356" y="21" class="badge-text" fill="#E2E8F0">📡 IoT &amp; Telematics</text>

      <!-- Pill 4: Open Source -->
      <rect x="510" y="0" width="155" height="32" rx="16" fill="#1E293B" stroke="#EC4899" stroke-width="1.2" />
      <circle cx="524" cy="16" r="4" fill="#EC4899" />
      <text x="536" y="21" class="badge-text" fill="#E2E8F0">⭐ Open Source</text>
    </g>
  </g>

  <!-- Top Right Dynamic Blinking Signal Status -->
  <g transform="translate(1030, 35)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10B981" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10B981" letter-spacing="0.5">LIVE ECOSYSTEM</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
